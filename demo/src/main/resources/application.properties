server.port=8080
spring.application.name=Student-Profile-Management-System

# ==============================================================================
# DATABASE CONFIGURATION (MySQL Connection Settings)
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/mse_java_exam_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Harsh@1728
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# AUTOMATIC DATABASE INITIALIZATION (schema.sql execution)
# ==============================================================================
# "always" ensures schema.sql runs on application startup to create tables if they do not exist
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ==============================================================================
# LOGGING CONFIGURATION
# ==============================================================================
logging.level.com.kiet.examproject=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
